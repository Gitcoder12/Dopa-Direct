name: Dopa-Direct Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile application and tests
        run: python -m compileall -q app.py main.py config.py storage.py timer.py streaks.py analytics.py achievements.py adaptive_redirector.py guardian.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
